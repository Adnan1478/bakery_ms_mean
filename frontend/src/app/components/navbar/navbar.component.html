<header class="navbar">
    <div class="container navbar-container">
        <a routerLink="/" class="logo">
            <span class="logo-icon">
                <svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"
                    class="bakery-logo-anim">
                    <g class="cupcake-group">
                        <!-- Wrapper -->
                        <path d="M12 36L18 58H46L52 36H12Z" fill="#F59E0B" stroke="#B45309" stroke-width="2"
                            stroke-linejoin="round" />
                        <path d="M22 36L26 58" stroke="#B45309" stroke-width="2" stroke-linecap="round" />
                        <path d="M32 36L32 58" stroke="#B45309" stroke-width="2" stroke-linecap="round" />
                        <path d="M42 36L38 58" stroke="#B45309" stroke-width="2" stroke-linecap="round" />
                        <!-- Frosting -->
                        <path d="M54 36C54 36 56 26 44 26C44 26 44 14 32 14C20 14 20 26 20 26C8 26 10 36 10 36H54Z"
                            fill="#F472B6" stroke="#DB2777" stroke-width="2" stroke-linejoin="round" />
                        <!-- Cherry -->
                        <circle cx="32" cy="14" r="5" fill="#EF4444" stroke="#B91C1C" stroke-width="2" />
                    </g>
                </svg>
            </span>
            <span class="logo-text">BakeDelight</span>
        </a>

        <nav class="nav-links">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
            <a routerLink="/menu" routerLinkActive="active">Menu</a>

            <ng-container *ngIf="user$ | async as user; else publicLinks">
                <a routerLink="/orders" routerLinkActive="active">My Orders</a>
                <a routerLink="/profile" routerLinkActive="active">Profile</a>
                <a *ngIf="user.role === 'admin' || user.role === 'staff'" routerLink="/admin/dashboard"
                    routerLinkActive="active">Dashboard</a>
            </ng-container>
            <ng-template #publicLinks>
                <!-- Public links if any -->
            </ng-template>
        </nav>

        <div class="nav-actions">
            <a routerLink="/cart" class="cart-btn" routerLinkActive="active">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="feather feather-shopping-cart">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="badge" *ngIf="totalCartItems > 0">{{ totalCartItems }}</span>
            </a>

            <div class="auth-buttons" *ngIf="user$ | async as user; else loginBtns">
                <span class="crumb-coins-badge" title="Crumb Coins Balance">
                    🥇 {{ user.crumbCoins || 0 }}
                </span>
                <span class="welcome-text">Hi, {{ user.name.split(' ')[0] }}</span>
                <button (click)="logout()" class="btn btn-outline btn-sm">Logout</button>
            </div>
            <ng-template #loginBtns>
                <div class="auth-buttons">
                    <a routerLink="/login" class="btn btn-outline">Login</a>
                    <a routerLink="/register" class="btn btn-primary">Sign Up</a>
                </div>
            </ng-template>
        </div>
    </div>
</header>
