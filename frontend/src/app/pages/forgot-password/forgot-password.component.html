<div class="auth-page">
    <div class="auth-card card">
        <div class="auth-header">
            <h2>Forgot Password</h2>
            <p *ngIf="step === 1">Enter your email to receive an OTP</p>
            <p *ngIf="step === 2">Enter OTP to reset password</p>
        </div>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">

            <!-- Step 1: Email -->
            <div *ngIf="step === 1">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" formControlName="email"
                        placeholder="name@example.com" [class.is-invalid]="submitted && f['email'].errors">
                    <div *ngIf="submitted && f['email'].errors" class="text-error">
                        <div *ngIf="f['email'].errors['required']">Email is required</div>
                        <div *ngIf="f['email'].errors['email']">Email must be valid</div>
                    </div>
                </div>
            </div>

            <!-- Step 2: OTP & New Password -->
            <div *ngIf="step === 2">
                <div class="alert alert-info mb-3"
                    style="font-size: 0.9rem; background: #e0f2fe; color: #0284c7; padding: 10px; border-radius: 4px;">
                    OTP sent to {{ userEmail }}. Check console/alert for demo.
                </div>

                <div class="form-group">
                    <label for="otp">Enter 6-Digit OTP</label>
                    <input type="text" id="otp" class="form-input" formControlName="otp" placeholder="123456"
                        [class.is-invalid]="submitted && f['otp'].errors">
                    <div *ngIf="submitted && f['otp'].errors" class="text-error">
                        OTP is required
                    </div>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" class="form-input" formControlName="newPassword"
                        placeholder="Enter new password" [class.is-invalid]="submitted && f['newPassword'].errors">
                    <div *ngIf="submitted && f['newPassword'].errors" class="text-error">
                        <div *ngIf="f['newPassword'].errors['required']">Password is required</div>
                        <div *ngIf="f['newPassword'].errors['minlength']">Min 6 characters</div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" [disabled]="loading">
                {{ loading ? 'Processing...' : (step === 1 ? 'Send OTP' : 'Reset Password') }}
            </button>
        </form>

        <div class="auth-footer">
            <p>Remember your password? <a routerLink="/login">Login</a></p>
        </div>
    </div>
</div>
