<div class="auth-page">
    <div class="auth-card card">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Login to continue directly to your account</p>
        </div>

        <div *ngIf="error" class="alert alert-danger">
            {{ error }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-input" formControlName="email"
                    placeholder="name@example.com">
                <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-error">
                    Valid email is required
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-input" formControlName="password"
                    placeholder="Enter your password">
                <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
                    class="text-error">
                    Password must be at least 6 characters
                </div>
            </div>

            <div class="forgot-password text-end mb-3">
                <a routerLink="/forgot-password" class="text-link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-full" [disabled]="loginForm.invalid || loading">
                {{ loading ? 'Logging in...' : 'Login' }}
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a routerLink="/register">Sign Up</a></p>
        </div>
    </div>
</div>
