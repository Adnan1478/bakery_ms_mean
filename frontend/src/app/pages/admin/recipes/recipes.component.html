<div class="page-container fade-in">
    <div class="page-header">
        <div class="header-content">
            <h1>Manage Recipes</h1>
            <p class="subtitle">Create and organize baking recipes</p>
        </div>
        <button class="btn btn-primary btn-glow" (click)="openCreate()">
            <span class="icon">+</span> Add New Recipe
        </button>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" *ngIf="showForm" (click)="cancelEdit()">
        <!-- Modal Content -->
        <div class="modal-content glass-panel scale-in" (click)="$event.stopPropagation()">
            <div class="modal-header">
                <h2>{{ editMode ? 'Edit Recipe' : 'Add New Recipe' }}</h2>
                <button class="btn-close" (click)="cancelEdit()">×</button>
            </div>

            <form [formGroup]="recipeForm" (ngSubmit)="onSubmit()" class="modal-body">
                <div class="form-grid">
                    <!-- Left Column: Product & Instructions -->
                    <div class="form-column">
                        <div class="form-group">
                            <label class="static-label">Select Product</label>
                            <select class="form-input select-input" formControlName="product">
                                <option value="" disabled>Select a product</option>
                                <option *ngFor="let p of products" [value]="p._id">{{ p.name }}</option>
                            </select>
                        </div>

                        <div class="form-group floating-label">
                            <textarea id="instructions" class="form-input textarea-input" formControlName="instructions"
                                rows="12" placeholder=" "></textarea>
                            <label for="instructions">Preparation Instructions</label>
                        </div>
                    </div>

                    <!-- Right Column: Ingredients -->
                    <div class="form-column">
                        <label class="static-label">Ingredients</label>
                        <div class="ingredients-container">
                            <div formArrayName="ingredients">
                                <div *ngFor="let ing of ingredients.controls; let i=index" class="ingredient-row">
                                    <input type="text" [formControlName]="i" placeholder="e.g. 2 cups of flour"
                                        class="form-input sm grid-item-full">
                                    <button type="button" class="btn-icon delete-small" (click)="removeIngredient(i)"
                                        title="Remove">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="3 6 5 6 21 6"></polyline>
                                            <path
                                                d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                            </path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <button type="button" class="btn btn-secondary btn-sm mt-3" (click)="addIngredient()">
                                <span class="icon">+</span> Add Ingredient
                            </button>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-text" (click)="cancelEdit()">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-wide" [disabled]="recipeForm.invalid || loading">
                        <span *ngIf="loading" class="spinner"></span>
                        {{ editMode ? 'Update Recipe' : 'Save Recipe' }}
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Recipes Table -->
    <div class="card table-container slide-up" *ngIf="!loading">
        <table class="data-table">
            <thead>
                <tr>
                    <th style="width: 80px;">Image</th>
                    <th style="width: 25%;">Product Name</th>
                    <th style="width: 40%;">Ingredients</th>
                    <th style="width: 120px; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let r of recipes" class="hover-row">
                    <td>
                        <div class="img-wrapper">
                            <img [src]="'http://localhost:5000' + r.product?.image" alt="img" class="thumb"
                                *ngIf="r.product?.image; else noThumb">
                            <ng-template #noThumb>
                                <div class="thumb-placeholder">?</div>
                            </ng-template>
                        </div>
                    </td>
                    <td class="font-medium">{{ r.product?.name || 'Unknown Product' }}</td>
                    <td>
                        <div class="ingredients-list">
                            <span *ngFor="let ing of r.ingredients" class="badge category-badge"
                                style="margin-right: 4px; margin-bottom: 4px; display: inline-block;">
                                {{ ing }}
                            </span>
                        </div>
                    </td>
                    <td>
                        <div class="actions">
                            <button class="btn-icon edit" (click)="openEdit(r)" title="Edit">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                    <path d="M18.5 2.5a2.121 2 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                </svg>
                            </button>
                            <button class="btn-icon delete" (click)="deleteRecipe(r._id)" title="Delete">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path
                                        d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                    </path>
                                    <line x1="10" y1="11" x2="10" y2="17"></line>
                                    <line x1="14" y1="11" x2="14" y2="17"></line>
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        <div *ngIf="recipes.length === 0" class="empty-state">
            <div class="empty-icon">🍳</div>
            <h3>No Recipes Yet</h3>
            <p>Start by creating a recipe for your products!</p>
            <button class="btn btn-primary btn-sm" (click)="openCreate()">Add Recipe</button>
        </div>
    </div>
</div>
