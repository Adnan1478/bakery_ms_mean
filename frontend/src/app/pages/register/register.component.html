<div class="auth-page">
    <div class="auth-card card">
        <div class="auth-header">
            <h2>Create Account</h2>
            <p>Join BakeryMS today for fresh delights</p>
        </div>

        <div *ngIf="error" class="alert alert-danger">
            {{ error }}
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" class="form-input" formControlName="name" placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-input" formControlName="email"
                    placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" class="form-input" formControlName="phone" placeholder="+1 234 567 890">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-input" formControlName="password"
                    placeholder="Min 6 characters">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-input" formControlName="confirmPassword"
                    placeholder="Repeat password">
            </div>

            <fieldset formGroupName="address" class="address-fieldset">
                <legend>Address (Optional)</legend>
                <div class="form-group">
                    <input type="text" class="form-input" formControlName="street" placeholder="Street Address">
                </div>
                <div class="flex gap-2">
                    <div class="form-group" style="flex: 2">
                        <input type="text" class="form-input" formControlName="city" placeholder="City">
                    </div>
                    <div class="form-group" style="flex: 1">
                        <input type="text" class="form-input" formControlName="zip" placeholder="Zip">
                    </div>
                </div>
            </fieldset>

            <button type="submit" class="btn btn-primary btn-full" [disabled]="registerForm.invalid || loading">
                {{ loading ? 'Creating Account...' : 'Sign Up' }}
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a routerLink="/login">Login</a></p>
        </div>
    </div>
</div>
